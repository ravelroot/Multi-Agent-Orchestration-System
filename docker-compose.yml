services:
  apogeu:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      APOGEU_OLLAMA_URL: http://ollama:11434
    volumes:
      - dados:/dados
    depends_on:
      - ollama
  ollama:
    image: ollama/ollama:latest
    volumes:
      - modelos:/root/.ollama
volumes:
  dados:
  modelos:
