name: Registro diário

on:
  schedule:
    - cron: "23 11 * * *"
    - cron: "47 13 * * *"
    - cron: "19 16 * * *"
    - cron: "41 19 * * *"
    - cron: "13 22 * * *"
  workflow_dispatch:
    inputs:
      turno:
        description: "Turno a registrar"
        required: true
        default: testes
        type: choice
        options: [testes, grafo, equipe, codigo, demonstracao]

permissions:
  contents: write

concurrency:
  group: registro-diario
  cancel-in-progress: false

jobs:
  registrar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - run: pip install -r requirements-ci.txt

      - name: Registrar
        env:
          GIT_NAME: ${{ secrets.GIT_NAME }}
          GIT_EMAIL: ${{ secrets.GIT_EMAIL }}
          AGENDA: ${{ github.event.schedule }}
          TURNO_MANUAL: ${{ inputs.turno }}
          APOGEU_PROVEDOR: demonstracao
          APOGEU_FERRAMENTAS: simuladas
        run: |
          if [ -z "$GIT_NAME" ] || [ -z "$GIT_EMAIL" ]; then
            echo "Defina os secrets GIT_NAME e GIT_EMAIL no repositório."
            exit 1
          fi
          case "$AGENDA" in
            "23 11 * * *") TURNO=testes ;;
            "47 13 * * *") TURNO=grafo ;;
            "19 16 * * *") TURNO=equipe ;;
            "41 19 * * *") TURNO=codigo ;;
            "13 22 * * *") TURNO=demonstracao ;;
            *) TURNO="$TURNO_MANUAL" ;;
          esac
          case "$TURNO" in
            testes) MENSAGEM="Testes automatizados" ;;
            grafo) MENSAGEM="Grafo da equipe" ;;
            equipe) MENSAGEM="Agentes e ferramentas" ;;
            codigo) MENSAGEM="Tamanho do código" ;;
            demonstracao) MENSAGEM="Execução de demonstração" ;;
            *) echo "Turno desconhecido: $TURNO"; exit 1 ;;
          esac
          export TZ=America/Sao_Paulo
          HOJE=$(date +%Y-%m-%d)
          ARQUIVO=.github/atividade.txt
          git config user.name "$GIT_NAME"
          git config user.email "$GIT_EMAIL"
          git pull --rebase --quiet origin main
          if grep -q "^$HOJE $TURNO " "$ARQUIVO" 2>/dev/null; then
            echo "O turno $TURNO de hoje já foi registrado."
            exit 0
          fi
          python scripts/registro_diario.py "$TURNO"
          echo "$HOJE $TURNO $(date +%H:%M) (Brasília)" >> "$ARQUIVO"
          tail -n 150 "$ARQUIVO" > "$ARQUIVO.tmp" && mv "$ARQUIVO.tmp" "$ARQUIVO"
          git add "$ARQUIVO" docs/registro
          git commit -m "$MENSAGEM em $(date +%d/%m/%Y)"
          for tentativa in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((tentativa * 15))
            git pull --rebase origin main
          done
          echo "Não foi possível enviar o commit depois de 3 tentativas."
          exit 1
